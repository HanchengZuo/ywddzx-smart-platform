services:
  backend:
    build:
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.cloud.tencent.com}
    environment:
      APP_ENV: production
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID on the server}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?Set WEBAUTHN_ORIGIN on the server}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS on the server}
      TRUST_PROXY_HEADERS: "true"
