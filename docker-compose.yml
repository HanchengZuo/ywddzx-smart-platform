services:
  db:
    image: postgres:16
    container_name: ywddzx-db
    restart: always
    environment:
      POSTGRES_DB: ywddzx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ywddzx_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ywddzx-backend
    restart: always
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-${AMAP_KEY:-}}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-240}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_USE_INTERNAL: ${COS_USE_INTERNAL:-false}
      APP_FRONTEND_VERSION: ${APP_FRONTEND_VERSION:-}
      APP_FRONTEND_PACKAGE_PATH: /app/frontend-package.json
      QUALITY_DEADLINE_SCAN_MINUTES: ${QUALITY_DEADLINE_SCAN_MINUTES:-180}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-业务督导中心数智管理平台}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-true}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ywddzx
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5002:5000"
    volumes:
      - ./storage:/app/storage
      - ./storage/report_fonts:/usr/local/share/fonts/report-fonts:ro
      - ./frontend/package.json:/app/frontend-package.json:ro
    depends_on:
      - db

volumes:
  ywddzx_pgdata:
