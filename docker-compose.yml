services:
  db:
    image: postgres:16
    container_name: ywddzx-db
    restart: always
    environment:
      POSTGRES_DB: ywddzx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ywddzx_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ywddzx-backend
    restart: always
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-240}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION}
      COS_BUCKET: ${COS_BUCKET}
      APP_FRONTEND_VERSION: ${APP_FRONTEND_VERSION:-4.8.1}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:5173}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-业务督导中心数智管理平台}
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ywddzx
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5002:5000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - db

  frontend:
    image: node:20
    container_name: ywddzx-frontend
    working_dir: /app
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  ywddzx_pgdata:
