services:
  backend:
    environment:
      APP_ENV: development
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set a private APP_SECRET_KEY in the local .env before enabling LAN access}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRUST_PROXY_HEADERS: "false"

  frontend:
    image: node:20
    container_name: ywddzx-frontend
    working_dir: /app
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${DEV_FRONTEND_BIND_IP:-0.0.0.0}:5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --strictPort"
    depends_on:
      - backend
