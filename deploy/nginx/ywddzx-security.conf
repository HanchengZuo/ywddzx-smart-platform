# Include this file inside the production server block.
# Do not configure /storage as an alias: Flask must authenticate every file request.

server_tokens off;
client_max_body_size 550m;

# Only full-backup recovery accepts unlimited file size. Authenticate at Flask
# before consuming the body; stream rather than duplicating it in Nginx temp files.
location = /api/management/backups/import {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:5002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_hide_header Server;
}

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

location ^~ /storage/ {
    proxy_pass http://127.0.0.1:5002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This is the only trusted HTTP proxy hop. Overwrite any client-supplied
    # forwarding header so Flask receives the address restored by PROXY protocol.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_buffering on;
}
