# Install under /etc/nginx/conf.d (http context). An empty key is not limited.
map "$server_name:$uri" $ywddzx_notification_limit_key {
    default "";
    "ywddzx.com:/api/notifications/summary" $binary_remote_addr;
}

# Allow small bursts; pace repeated requests before they reach Gunicorn.
limit_req_zone $ywddzx_notification_limit_key zone=ywddzx_notification_summary:4m rate=2r/s;
limit_req zone=ywddzx_notification_summary burst=20 delay=4;
limit_req_status 429;
limit_req_log_level info;
