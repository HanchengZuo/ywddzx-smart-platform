# Production site template. Both HTTPS virtual hosts share the same
# PROXY-protocol listener and trust only the local Nginx stream hop.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 124.220.108.171 _;
    return 301 https://ywddzx.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ywddzx.com www.ywddzx.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name www.ywddzx.com;

    ssl_certificate /etc/letsencrypt/live/ywddzx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ywddzx.com/privkey.pem;

    return 301 https://ywddzx.com$request_uri;
}

server {
    listen 127.0.0.1:4443 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name ywddzx.com;

    ssl_certificate /etc/letsencrypt/live/ywddzx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ywddzx.com/privkey.pem;

    root /var/www/ywddzx;
    index index.html;
    include /etc/nginx/snippets/ywddzx-cache.conf;
    include /etc/nginx/snippets/ywddzx-security.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
