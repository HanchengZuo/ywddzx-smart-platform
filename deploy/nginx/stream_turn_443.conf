# Public TLS SNI router. The public listener emits PROXY protocol so the website
# HTTPS listener can recover the real client address. TURN and mock traffic pass
# through local sinks that accept and strip the header before reaching services
# that don't consume PROXY protocol.

stream {
    map $ssl_preread_server_name $backend {
        turn.qianxuntong.xyz  turn_proxy_sink;
        mock.ywddzx.com       mock_proxy_sink;
        default               web_up;
    }

    upstream turn_proxy_sink { server 127.0.0.1:15349; }
    upstream web_up { server 127.0.0.1:4443; }
    upstream mock_proxy_sink { server 127.0.0.1:14444; }

    server {
        listen 443 reuseport;
        proxy_pass $backend;
        proxy_protocol on;
        ssl_preread on;
    }

    server {
        listen 127.0.0.1:15349 proxy_protocol;
        proxy_pass 127.0.0.1:5349;
    }

    server {
        listen 127.0.0.1:14444 proxy_protocol;
        proxy_pass 127.0.0.1:4444;
    }
}
